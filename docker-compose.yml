# =====================================================================
# Groundwork — Full Docker Compose Stack
# =====================================================================
# Runs the complete Groundwork environment in Docker:
# 1. local-core: Local FastAPI search, indexing & AI context engine (port 8000)
# 2. app-ui: Groundwork App Web Interface (port 5173)
# 3. website: Marketing, download & documentation website (port 3000)
# 4. cloud-api: Cloud Sync Backend API (port 8080)
# 5. cloud-db: PostgreSQL database for cloud sync (port 5432)
# =====================================================================

services:
  # 1. Groundwork Local Core (FastAPI + SQLite FTS5)
  local-core:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: groundwork-local-core
    environment:
      PORT: 8000
      GROUNDWORK_ENV: development
    ports:
      - "8000:8000"
    volumes:
      - .:/workspace:rw
      - local_data:/root/.groundwork
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - groundwork-net
    restart: unless-stopped

  # 2. Groundwork App Interface (React Web Interface on port 5173)
  app-ui:
    build:
      context: ./desktop
      dockerfile: Dockerfile
    container_name: groundwork-app-ui
    depends_on:
      local-core:
        condition: service_healthy
    ports:
      - "${APP_PORT:-5174}:80"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:80/index.html"]
      interval: 15s
      timeout: 5s
      retries: 3
    networks:
      - groundwork-net
    restart: unless-stopped

  # 3. Marketing & Documentation Website (port 3000)
  website:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: groundwork-website
    ports:
      - "3000:80"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:80/index.html"]
      interval: 15s
      timeout: 5s
      retries: 3
    networks:
      - groundwork-net
    restart: unless-stopped

  # 4. Cloud Database (PostgreSQL for optional Cloud Sync)
  cloud-db:
    image: postgres:16-alpine
    container_name: groundwork-cloud-db
    environment:
      POSTGRES_DB: ${CLOUD_DB_NAME:-groundwork_cloud}
      POSTGRES_USER: ${CLOUD_DB_USER:-groundwork}
      POSTGRES_PASSWORD: ${CLOUD_DB_PASSWORD:-groundwork_secret}
    volumes:
      - cloud_pgdata:/var/lib/postgresql/data
    ports:
      - "${CLOUD_DB_PORT:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${CLOUD_DB_USER:-groundwork}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - groundwork-net
    restart: unless-stopped

  # 5. Cloud Sync Backend API (port 8080)
  cloud-api:
    build:
      context: ./cloud
      dockerfile: Dockerfile
    container_name: groundwork-cloud-api
    depends_on:
      cloud-db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${CLOUD_DB_USER:-groundwork}:${CLOUD_DB_PASSWORD:-groundwork_secret}@cloud-db:5432/${CLOUD_DB_NAME:-groundwork_cloud}
      PORT: 8080
      JWT_SECRET: ${JWT_SECRET:-groundwork-cloud-secret-key-min-32-chars-long}
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - groundwork-net
    restart: unless-stopped

volumes:
  local_data:
  cloud_pgdata:

networks:
  groundwork-net:
    driver: bridge
