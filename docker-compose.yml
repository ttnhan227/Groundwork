# =====================================================================
# Groundwork — Full Docker Compose Stack
# =====================================================================
# Runs the complete Groundwork environment in Docker:
# 1. local-engine: Embedded SQLite database, indexing, search and AI (port 8000)
# 2. desktop: Groundwork Desktop interface for browser development (port 5174)
# 3. website: Marketing, download & documentation website (port 3000)
# 4. backend: Cloud Sync Backend API (port 8080)
# 5. database: PostgreSQL for backend accounts and sync (port 5433)
# =====================================================================

services:
  # 1. Local engine: embedded SQLite database, indexing, search and AI (port 8000)
  local-engine:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: groundwork-local-engine
    environment:
      PORT: 8000
      GROUNDWORK_ENV: development
      GROUNDWORK_RUNTIME: local
      CORS_ORIGINS: http://localhost:${APP_PORT:-5174},http://127.0.0.1:${APP_PORT:-5174},http://localhost:1420,http://127.0.0.1:1420,tauri://localhost,http://tauri.localhost
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - .:/workspace:ro
      - local_data:/root/.groundwork
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - groundwork-net
    restart: unless-stopped

  # 2. Desktop interface for browser development (port 5174)
  desktop:
    build:
      context: ./desktop
      dockerfile: Dockerfile
    container_name: groundwork-desktop
    depends_on:
      local-engine:
        condition: service_healthy
    ports:
      - "${APP_PORT:-5174}:80"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:80/index.html"]
      interval: 15s
      timeout: 5s
      retries: 3
    networks:
      - groundwork-net
    restart: unless-stopped

  # 3. Marketing & Documentation Website (port 3000)
  website:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: groundwork-website
    ports:
      - "3000:80"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:80/index.html"]
      interval: 15s
      timeout: 5s
      retries: 3
    networks:
      - groundwork-net
    restart: unless-stopped

  # 4. Backend: accounts, authentication and metadata sync (port 8080)
  backend:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: groundwork-backend
    depends_on:
      database:
        condition: service_healthy
    environment:
      PORT: 8080
      GROUNDWORK_RUNTIME: hosted
      ENVIRONMENT: development
      DATABASE_URL: ${BACKEND_DATABASE_URL:-postgresql+psycopg2://groundwork:groundwork_dev@database:5432/groundwork}
      JWT_SECRET: ${BACKEND_JWT_SECRET:-dev-docker-jwt-secret-groundwork-2026}
      ACCESS_TOKEN_MINUTES: ${ACCESS_TOKEN_MINUTES:-15}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      CORS_ORIGINS: ${BACKEND_CORS_ORIGINS:-http://localhost:5174,http://localhost:3000,http://localhost:1420,tauri://localhost,http://tauri.localhost}
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - groundwork-net
    restart: unless-stopped

  # 5. Developer PostgreSQL database; SQLite remains inside local-engine.
  database:
    image: postgres:16-alpine
    container_name: groundwork-database
    environment:
      POSTGRES_USER: groundwork
      POSTGRES_PASSWORD: groundwork_dev
      POSTGRES_DB: groundwork
    ports:
      - "127.0.0.1:${DATABASE_PORT:-5433}:5432"
    volumes:
      - backend_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U groundwork -d groundwork"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - groundwork-net
    restart: unless-stopped

volumes:
  local_data:
  backend_pgdata:
  # Preserve the previous database volume without reusing its old configuration.
  cloud_pgdata:

networks:
  groundwork-net:
    driver: bridge
