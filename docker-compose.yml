services:
  # PostgreSQL with pgvector extension
  postgres:
    image: pgvector/pgvector:pg16
    container_name: groundwork-db
    environment:
      POSTGRES_DB: ${DB_NAME:-groundwork}
      POSTGRES_USER: ${DB_USER:-groundwork}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-groundwork}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --lc-collate=C --lc-ctype=C"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-groundwork}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - groundwork
    restart: unless-stopped

  # MinIO Object Storage (S3-compatible)
  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    container_name: groundwork-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-groundwork}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-groundwork-secret}
    volumes:
      - minio_data:/data
    ports:
      - "9000:9000"
      - "9001:9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - groundwork
    restart: unless-stopped

  # Redis Cache & Task Broker
  redis:
    image: redis:7-alpine
    container_name: groundwork-redis
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    networks:
      - groundwork
    restart: unless-stopped

  # FastAPI Backend API
  api:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: groundwork-api
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql+asyncpg://${DB_USER:-groundwork}:${DB_PASSWORD:-groundwork}@postgres:5432/${DB_NAME:-groundwork}
      REDIS_URL: redis://redis:6379/0
      S3_ENDPOINT_URL: http://minio:9000
      S3_ACCESS_KEY: ${MINIO_ROOT_USER:-groundwork}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-groundwork-secret}
      S3_BUCKET: groundwork
      JWT_SECRET: ${JWT_SECRET:-your-super-secret-jwt-key-minimum-32-chars-long}
      ENVIRONMENT: ${ENVIRONMENT:-production}
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    networks:
      - groundwork
    restart: unless-stopped

  # Celery Background Worker
  worker:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: groundwork-worker
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql+asyncpg://${DB_USER:-groundwork}:${DB_PASSWORD:-groundwork}@postgres:5432/${DB_NAME:-groundwork}
      REDIS_URL: redis://redis:6379/0
      S3_ENDPOINT_URL: http://minio:9000
      S3_ACCESS_KEY: ${MINIO_ROOT_USER:-groundwork}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-groundwork-secret}
      S3_BUCKET: groundwork
      JWT_SECRET: ${JWT_SECRET:-your-super-secret-jwt-key-minimum-32-chars-long}
      ENVIRONMENT: ${ENVIRONMENT:-production}
    command: celery -A app.tasks.celery_app:celery_app worker --loglevel=INFO --pool=solo --concurrency=2
    networks:
      - groundwork
    restart: unless-stopped

  # Celery Flower (Task Monitor)
  flower:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: groundwork-flower
    command: celery -A app.tasks.celery_app:celery_app flower --port=5555 --broker=redis://redis:6379/0
    depends_on:
      - redis
      - worker
    ports:
      - "5555:5555"
    networks:
      - groundwork
    restart: unless-stopped

  # React Frontend (Nginx SPA)
  client:
    build:
      context: ./client
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-/api/v1}
        VITE_GOOGLE_CLIENT_ID: ${VITE_GOOGLE_CLIENT_ID:-}
    container_name: groundwork-client
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "3000:80"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:80/index.html"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - groundwork
    restart: unless-stopped

  # Gateway Reverse Proxy
  nginx:
    image: nginx:1.27-alpine
    container_name: groundwork-gateway
    depends_on:
      api:
        condition: service_healthy
      client:
        condition: service_started
    ports:
      - "8080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - groundwork
    restart: unless-stopped

volumes:
  postgres_data:
  minio_data:
  redis_data:

networks:
  groundwork:
    driver: bridge
