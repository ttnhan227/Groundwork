<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 220" width="100%" height="220">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#090d16"/>
    </linearGradient>

    <!-- Accent Glow Gradient -->
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>

    <!-- Subtle Radial Glow -->
    <radialGradient id="radialGlow" cx="20%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0"/>
    </radialGradient>

    <!-- Grid Pattern -->
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#334155" stroke-width="0.5" stroke-opacity="0.3"/>
    </pattern>
  </defs>

  <!-- Background Layer -->
  <rect width="800" height="220" rx="12" fill="url(#bgGrad)"/>
  <rect width="800" height="220" rx="12" fill="url(#radialGlow)"/>
  <rect width="800" height="220" rx="12" fill="url(#grid)"/>

  <!-- Border -->
  <rect width="798" height="218" x="1" y="1" rx="11" fill="none" stroke="#1e293b" stroke-width="1.5"/>

  <!-- Brand Symbol (Left Icon Box) -->
  <g transform="translate(60, 45)">
    <!-- Icon Container Glow & Card -->
    <rect width="130" height="130" rx="24" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
    
    <!-- Isometric Layer Stack Icon -->
    <g transform="translate(25, 20)">
      <!-- Top Anchor Arrow -->
      <path d="M40 8 L50 20 H44 V30 H36 V20 H30 L40 8 Z" fill="url(#accentGrad)"/>

      <!-- Layer 1 (Top Deliverable Sheet) -->
      <path d="M40 28 L68 42 L40 56 L12 42 Z" fill="#1e293b" stroke="#38bdf8" stroke-width="2.2" stroke-linejoin="round"/>
      
      <!-- Layer 2 (Verification Middle Layer) -->
      <path d="M12 52 L40 66 L68 52" fill="none" stroke="#6366f1" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
      
      <!-- Layer 3 (Grounding Foundation Layer) -->
      <path d="M12 62 L40 76 L68 62" fill="none" stroke="#10b981" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
      
      <!-- Small verified badge dot -->
      <circle cx="68" cy="42" r="3.5" fill="#10b981"/>
    </g>
  </g>

  <!-- Typography & Content -->
  <g transform="translate(225, 62)">
    <!-- Main Title -->
    <text x="0" y="32" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', sans-serif" font-size="38" font-weight="800" fill="#ffffff" letter-spacing="-0.5">
      GROUNDWORK
    </text>

    <!-- Subtitle / Tagline -->
    <text x="0" y="62" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', sans-serif" font-size="16" font-weight="500" fill="#94a3b8">
      Verification-Gated Document Studio &amp; Claim Auditing Engine
    </text>

    <!-- Feature Pills / Badges -->
    <g transform="translate(0, 84)">
      <!-- Pill 1 -->
      <rect x="0" y="0" width="105" height="24" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <circle cx="12" cy="12" r="3" fill="#38bdf8"/>
      <text x="22" y="15" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10.5" font-weight="600" fill="#cbd5e1">RAG Drafting</text>

      <!-- Pill 2 -->
      <rect x="115" y="0" width="118" height="24" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <circle cx="127" cy="12" r="3" fill="#6366f1"/>
      <text x="137" y="15" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10.5" font-weight="600" fill="#cbd5e1">Claim Auditing</text>

      <!-- Pill 3 -->
      <rect x="243" y="0" width="128" height="24" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <circle cx="255" cy="12" r="3" fill="#10b981"/>
      <text x="265" y="15" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10.5" font-weight="600" fill="#cbd5e1">Traceability Matrix</text>

      <!-- Pill 4 -->
      <rect x="381" y="0" width="110" height="24" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <circle cx="393" cy="12" r="3" fill="#f59e0b"/>
      <text x="403" y="15" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10.5" font-weight="600" fill="#cbd5e1">9 Languages</text>
    </g>
  </g>
</svg>
