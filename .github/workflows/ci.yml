name: CI

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ──────────────────────────────────────────────
  # 1. Local Core: SQLite, FTS5, Hybrid Search & Eval
  # ──────────────────────────────────────────────
  local-core:
    name: Local Core (Pytest + Search Eval)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: server/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r server/requirements.txt pytest

      - name: Run Local Core Unit & Integration Tests
        working-directory: server
        run: pytest tests/ -v

      - name: Run Hybrid Search Evaluation Benchmark
        working-directory: server
        run: python eval/search_eval.py

  # ──────────────────────────────────────────────
  # 2. Cloud Sync Backend: Multi-Tenant Tests
  # ──────────────────────────────────────────────
  cloud-backend:
    name: Cloud Backend (Pytest)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: cloud/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r cloud/requirements.txt pytest

      - name: Run Cloud Sync Tests
        working-directory: cloud
        run: pytest tests/ -v

  # ──────────────────────────────────────────────
  # 3. Desktop Application: Tauri & React Build
  # ──────────────────────────────────────────────
  desktop-client:
    name: Desktop Client (TypeScript & Vite Build)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: desktop/package.json

      - name: Install desktop dependencies
        working-directory: desktop
        run: npm install

      - name: Build desktop application bundle
        working-directory: desktop
        run: npm run build

  # ──────────────────────────────────────────────
  # 4. Web Portal: Marketing & Docs Website Build
  # ──────────────────────────────────────────────
  web-portal:
    name: Marketing & Docs Site (Vite Build)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install web dependencies
        working-directory: client
        run: npm install

      - name: Build web application bundle
        working-directory: client
        run: npm run build
