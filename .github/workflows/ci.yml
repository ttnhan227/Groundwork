name: CI

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ──────────────────────────────────────────────
  # 1. Local Core: SQLite, FTS5, Hybrid Search & Eval
  # ──────────────────────────────────────────────
  local-core:
    name: Local Core (Pytest + Search Eval)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: server/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r server/requirements.txt pytest

      - name: Run Local Core Unit & Integration Tests
        working-directory: server
        run: pytest tests/ -v

      - name: Run Hybrid Search Evaluation Benchmark
        working-directory: server
        run: python eval/search_eval.py

  # ──────────────────────────────────────────────
  # 2. Cloud Sync Backend: Multi-Tenant Tests
  # ──────────────────────────────────────────────
  cloud-backend:
    name: Cloud Backend (Pytest)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: server/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r server/requirements.txt pytest

      - name: Run Cloud Sync Tests
        working-directory: server
        run: pytest tests/hosted -v

  # ──────────────────────────────────────────────
  # 3. Desktop Application: Tauri & React Build
  # ──────────────────────────────────────────────
  desktop-client:
    name: Desktop Client (TypeScript & Vite Build)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: desktop/package.json

      - name: Install desktop dependencies
        working-directory: desktop
        run: npm ci

      - name: Build desktop application bundle
        working-directory: desktop
        run: npm run build

  # ──────────────────────────────────────────────
  # 4. Web Portal: Marketing & Docs Website Build
  # ──────────────────────────────────────────────
  web-portal:
    name: Marketing & Docs Site (Vite Build)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install web dependencies
        working-directory: client
        run: npm ci

      - name: Build web application bundle
        working-directory: client
        run: npm run build

  windows-installer:
    name: Windows desktop installer
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: dtolnay/rust-toolchain@stable
      - run: npm ci
        working-directory: desktop
      - run: npm ci
        working-directory: client
      - run: python -m pip install -r server/requirements.txt
      - run: npm run tauri -- build
        working-directory: desktop
      - run: python desktop/scripts/smoke-core.py
      - run: python desktop/scripts/smoke-scale.py
      - run: python desktop/scripts/smoke-sync.py
      - run: ./desktop/scripts/smoke-installed-ci.ps1 -Installer desktop/src-tauri/target/release/bundle/nsis/Groundwork_0.1.0_x64-setup.exe
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-test-diagnostics
          path: desktop/test-results/
      - uses: actions/upload-artifact@v4
        with:
          name: groundwork-windows-installer
          path: desktop/src-tauri/target/release/bundle/
