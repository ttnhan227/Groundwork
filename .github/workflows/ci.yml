name: CI

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ──────────────────────────────────────────────
  # 1. Local Core: SQLite, FTS5, Hybrid Search & Eval
  # ──────────────────────────────────────────────
  local-core:
    name: Local Core (Pytest + Search Eval)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: server/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r server/requirements.txt pytest

      - name: Run Local Core Unit & Integration Tests
        working-directory: server
        run: pytest tests/ -v

      - name: Run Hybrid Search Evaluation Benchmark
        working-directory: server
        run: python eval/search_eval.py

  # ──────────────────────────────────────────────
  # 2. Cloud Sync Backend: Multi-Tenant Tests
  # ──────────────────────────────────────────────
  cloud-backend:
    name: Cloud Backend (Pytest)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: server/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r server/requirements.txt pytest

      - name: Run Cloud Sync Tests
        working-directory: server
        run: pytest tests/hosted -v

  # ──────────────────────────────────────────────
  # 3. Desktop Application: Tauri & React Build
  # ──────────────────────────────────────────────
  desktop-client:
    name: Desktop Client (TypeScript & Vite Build)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: desktop/package.json

      - name: Install desktop dependencies
        working-directory: desktop
        run: npm ci

      - name: Build desktop application bundle
        working-directory: desktop
        run: npm run build

      - name: Install browser test dependencies
        working-directory: client
        run: npm ci && npx playwright install --with-deps chromium

      - name: Verify desktop onboarding and reader workflows
        run: node --test desktop/tests/onboarding-ui.test.cjs desktop/tests/reader-ui.test.cjs

  # ──────────────────────────────────────────────
  # 4. Web Portal: Marketing & Docs Website Build
  # ──────────────────────────────────────────────
  web-portal:
    name: Marketing & Docs Site (Vite Build)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install web dependencies
        working-directory: client
        run: npm ci

      - name: Build web application bundle
        working-directory: client
        run: npm run build

      - name: Verify website lint, content and release resolution
        working-directory: client
        run: |
          npm run lint
          node --test tests/rendered-html.test.mjs
          node --experimental-strip-types --test tests/releases.test.mjs

      - name: Verify download and navigation interactions
        working-directory: client
        run: |
          npx playwright install --with-deps chromium
          node --test tests/download-release-ui.test.mjs

  windows-installer:
    name: Windows desktop installer
    runs-on: windows-latest
    env:
      DESKTOP_API_BASE_URL: ${{ vars.DESKTOP_API_BASE_URL || 'https://groundwork-api-597984371188.asia-southeast1.run.app' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: dtolnay/rust-toolchain@stable
      - run: npm ci
        working-directory: desktop
      - run: npm ci
        working-directory: client
      - run: python -m pip install -r server/requirements.txt
      - run: npm run tauri -- build
        working-directory: desktop
      - run: python desktop/scripts/smoke-core.py
      - run: cargo test --manifest-path desktop/src-tauri/Cargo.toml
      - run: python desktop/scripts/smoke-storage.py
      - run: python desktop/scripts/smoke-scale.py
      - run: python desktop/scripts/smoke-sync.py
      - name: Test generated Windows installer
        shell: pwsh
        run: |
          $installer = Get-ChildItem -LiteralPath desktop/src-tauri/target/release/bundle/nsis -Filter '*-setup.exe'
          if (@($installer).Count -ne 1) { throw 'Expected one Windows installer' }
          ./desktop/scripts/smoke-installed-ci.ps1 -Installer $installer.FullName
          if ($LASTEXITCODE) { throw 'Installed application checks failed' }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-test-diagnostics
          path: desktop/test-results/
      - uses: actions/upload-artifact@v4
        with:
          name: groundwork-windows-installer
          path: desktop/src-tauri/target/release/bundle/

  deploy-backend:
    needs: [local-core, cloud-backend, desktop-client, web-portal, windows-installer]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.PRODUCTION_AUTOMATION_ENABLED == 'true'
    uses: ./.github/workflows/deploy.yml
    permissions:
      contents: read
      id-token: write
    with:
      ref: ${{ github.sha }}
    secrets: inherit

  deploy-website:
    needs: [local-core, cloud-backend, desktop-client, web-portal, windows-installer]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.PRODUCTION_AUTOMATION_ENABLED == 'true'
    uses: ./.github/workflows/website.yml
    secrets: inherit
