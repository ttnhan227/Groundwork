name: CI

on:
  push:
  pull_request:

jobs:
  # ──────────────────────────────────────────────
  # Backend: lint → unit/integration tests
  # Includes AST-level multi-tenant isolation guard
  # ──────────────────────────────────────────────
  backend:
    name: Backend (lint + pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: server/requirements.txt

      - name: Install dependencies
        run: pip install --extra-index-url https://download.pytorch.org/whl/cpu torch==2.7.1 -r server/requirements.txt ruff

      - name: Lint (ruff)
        run: ruff check server/app server/tests

      - name: Run test suite
        # Covers: data-isolation guard, AI orchestration, deliverable lifecycle,
        # hallucination detection, background jobs, CORS, auth
        run: python -m pytest -q
        working-directory: server

  # ──────────────────────────────────────────────
  # Frontend: lint → unit tests
  # ──────────────────────────────────────────────
  frontend:
    name: Frontend (ESLint + Vitest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: client

      - name: Lint (ESLint)
        run: npm run lint
        working-directory: client

      - name: Unit tests (Vitest)
        run: npm test
        working-directory: client

  # ──────────────────────────────────────────────
  # Docker: build smoke-test (gated on passing tests)
  # ──────────────────────────────────────────────
  docker:
    name: Docker build smoke-test
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4

      - name: Build all service images
        run: docker compose build api worker client

  # ──────────────────────────────────────────────
  # E2E: full stack via Playwright (gated on passing tests)
  # ──────────────────────────────────────────────
  e2e:
    name: E2E (Playwright against full Docker stack)
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Configure environment
        run: cp .env.example .env

      - name: Start full stack (docker compose)
        run: docker compose up --build -d

      - name: Install Playwright dependencies
        run: npm ci
        working-directory: client

      - name: Install Chromium
        run: npx playwright install --with-deps chromium
        working-directory: client

      - name: Run Playwright tests
        run: npm run test:e2e
        working-directory: client

      - name: Dump service logs on failure
        if: always()
        run: docker compose logs --no-color
