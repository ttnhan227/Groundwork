name: CI

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ──────────────────────────────────────────────
  # 1. Backend: linting & test suite
  # ──────────────────────────────────────────────
  backend:
    name: Backend (Ruff + Pytest)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: server/requirements.txt

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libreoffice-writer \
            tesseract-ocr \
            tesseract-ocr-eng

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r server/requirements.txt ruff

      - name: Lint with Ruff (Strict)
        working-directory: server
        run: ruff check app tests

      - name: Run Pytest test suite
        working-directory: server
        env:
          ENVIRONMENT: development
          JWT_SECRET: ci-testing-super-secret-key-at-least-32-chars-long!
          MINIO_ACCESS_KEY: groundwork
          MINIO_SECRET_KEY: groundwork-secret
        run: python -m pytest -q

  # ──────────────────────────────────────────────
  # 2. Frontend: linting, type check & tests
  # ──────────────────────────────────────────────
  frontend:
    name: Frontend (ESLint + Vitest + TypeCheck)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install dependencies
        working-directory: client
        run: npm ci

      - name: Lint with ESLint
        working-directory: client
        run: npm run lint

      - name: Run Typecheck, Build, Vitest & Rendered HTML tests
        working-directory: client
        run: npm test

  # ──────────────────────────────────────────────
  # 3. Database: verify all Alembic migrations apply cleanly
  # ──────────────────────────────────────────────
  migration-check:
    name: Database Migration Validation
    runs-on: ubuntu-latest
    needs: backend
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: groundwork
          POSTGRES_PASSWORD: changeme
          POSTGRES_DB: groundwork_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: server/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r server/requirements.txt

      - name: Run Alembic migrations to head
        working-directory: server
        env:
          DATABASE_URL: postgresql+asyncpg://groundwork:changeme@localhost:5432/groundwork_test
        run: alembic upgrade head

  # ──────────────────────────────────────────────
  # 4. Security Scan (Trivy)
  # ──────────────────────────────────────────────
  security-scan:
    name: Security Vulnerability Scan (Trivy)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run Trivy filesystem scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: "fs"
          scan-ref: "."
          severity: "CRITICAL,HIGH"
          format: "sarif"
          output: "trivy-results.sarif"

      - name: Upload scan results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        continue-on-error: true
        with:
          sarif_file: "trivy-results.sarif"

  # ──────────────────────────────────────────────
  # 5. Docker: build smoke-test
  # ──────────────────────────────────────────────
  docker-build:
    name: Docker Build Smoke-Test
    runs-on: ubuntu-latest
    needs: [backend, frontend, migration-check]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: actions/setup-buildx-action@v3

      - name: Build all service images
        run: docker compose build api worker client nginx

  # ──────────────────────────────────────────────
  # 6. E2E: full stack via Playwright
  # ──────────────────────────────────────────────
  e2e:
    name: E2E (Playwright against Docker stack)
    runs-on: ubuntu-latest
    needs: [docker-build]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Configure environment
        run: cp .env.example .env

      - name: Start full stack (docker compose)
        run: docker compose up --build -d

      - name: Wait for Gateway healthy
        run: |
          for i in {1..30}; do
            if curl -s -f http://127.0.0.1:8080/health > /dev/null; then
              echo "Gateway is healthy!"
              exit 0
            fi
            echo "Waiting for services to become healthy... ($i/30)"
            sleep 3
          done
          echo "Timeout waiting for gateway"
          exit 1
        shell: bash

      - name: Install Playwright dependencies
        working-directory: client
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Run Playwright tests
        working-directory: client
        run: npm run test:e2e

      - name: Dump service logs on failure
        if: always()
        run: docker compose logs --no-color
