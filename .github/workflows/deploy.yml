name: Deploy optional cloud sync

on:
  workflow_dispatch:

jobs:
  deploy-cloud:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}
      - name: Configure registry
        run: gcloud auth configure-docker asia-southeast1-docker.pkg.dev --quiet
      - uses: docker/build-push-action@v6
        with:
          context: ./cloud
          push: true
          tags: asia-southeast1-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/groundwork/cloud:${{ github.sha }}
      - uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: groundwork-cloud-sync
          region: asia-southeast1
          image: asia-southeast1-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/groundwork/cloud:${{ github.sha }}
          env_vars: ENVIRONMENT=production
          secrets: |
            DATABASE_URL=groundwork-cloud-database-url:latest
            JWT_SECRET=groundwork-cloud-jwt-secret:latest
