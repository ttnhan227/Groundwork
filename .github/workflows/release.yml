name: Publish Windows desktop release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag, for example v1.0.0
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: windows-desktop-release
  cancel-in-progress: false

jobs:
  build-and-test:
    name: Build & Verify Native Windows 1.0 Release
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref_name }}
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verify release tag and synchronize versions
        shell: pwsh
        run: |
          if ($env:RELEASE_TAG -notmatch '^v\d+\.\d+\.\d+$') { throw 'Use vMAJOR.MINOR.PATCH (e.g. v1.0.0)' }
          git rev-parse --verify "refs/tags/$env:RELEASE_TAG"
          if ($LASTEXITCODE) { throw 'The release tag does not exist' }
          node desktop/scripts/set-release-version.mjs $env:RELEASE_TAG
          if ($LASTEXITCODE) { throw 'Version synchronization failed' }

      - name: Install Python test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r server/requirements.txt pytest pyinstaller

      - name: Run Windows release build pipeline & automated tests
        shell: pwsh
        run: ./scripts/build-windows-release.ps1

      - name: Package release ZIP and checksums
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path release-assets -Force | Out-Null
          $zipName = "Groundwork-$env:RELEASE_TAG-windows-x64.zip"
          Compress-Archive -Path "dist/Groundwork/*" -DestinationPath "release-assets/$zipName" -Force
          Copy-Item -Path "dist/Groundwork/checksums.txt" -Destination "release-assets/checksums.txt" -Force
          Write-Host "Created release package: release-assets/$zipName"

      - uses: actions/upload-artifact@v4
        with:
          name: verified-windows-release
          path: release-assets/
          if-no-files-found: error

  publish:
    name: Publish GitHub Release with Changelog
    needs: build-and-test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: verified-windows-release
          path: release-assets

      - name: Create or update GitHub Release with changelog
        shell: bash
        run: |
          set -euo pipefail
          cd release-assets
          ZIP_NAME="Groundwork-${RELEASE_TAG}-windows-x64.zip"

          latest=true
          prerelease=false
          if [[ "$RELEASE_TAG" == v0.* ]]; then
            latest=false
            prerelease=true
          fi

          if gh release view "$RELEASE_TAG" > /dev/null 2>&1; then
            echo "Release $RELEASE_TAG already exists. Uploading assets..."
            gh release upload "$RELEASE_TAG" "$ZIP_NAME" checksums.txt --clobber
            gh release edit "$RELEASE_TAG" --draft=false --prerelease="$prerelease" --latest="$latest"
          else
            echo "Creating new release $RELEASE_TAG with automated changelog..."
            gh release create "$RELEASE_TAG" "$ZIP_NAME" checksums.txt \
              --title "Groundwork $RELEASE_TAG" \
              --generate-notes \
              --prerelease="$prerelease" \
              --latest="$latest"
          fi
          echo "Successfully published Groundwork $RELEASE_TAG"
