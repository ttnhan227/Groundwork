name: Publish Windows desktop release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag, for example v0.1.0 (preview)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: windows-desktop-release
  cancel-in-progress: false

jobs:
  build-and-test:
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
      DESKTOP_API_BASE_URL: ${{ vars.DESKTOP_API_BASE_URL }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: dtolnay/rust-toolchain@stable
      - name: Verify tag and set matching application versions
        shell: pwsh
        run: |
          if ($env:RELEASE_TAG -notmatch '^v\d+\.\d+\.\d+$') { throw 'Use vMAJOR.MINOR.PATCH; 0.x versions are previews' }
          git rev-parse --verify "refs/tags/$env:RELEASE_TAG"
          if ($LASTEXITCODE) { throw 'The release tag does not exist' }
          node desktop/scripts/set-release-version.mjs $env:RELEASE_TAG
          if ($LASTEXITCODE) { throw 'Version preparation failed' }
      - run: npm ci
        working-directory: desktop
      - run: npm ci
        working-directory: client
      - run: npm run build
        working-directory: client
      - run: node --experimental-strip-types --test tests/releases.test.mjs
        working-directory: client
      - run: node --test desktop/scripts/set-release-version.test.mjs
      - run: npx playwright install chromium
        working-directory: client
      - run: node --test tests/download-release-ui.test.mjs
        working-directory: client
      - run: python -m pip install -r server/requirements.txt pytest
      - run: python -m pytest server/tests/hosted -q
      - name: Build and verify the release signature
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE_BASE64: ${{ secrets.WINDOWS_CERTIFICATE_BASE64 }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: ./scripts/build-signed-release.ps1
        working-directory: desktop
      - run: node --test desktop/tests/onboarding-ui.test.cjs
      - run: server/.packaging-venv/Scripts/python.exe -m pytest server/tests -q
      - run: python desktop/scripts/smoke-core.py
      - run: python desktop/scripts/smoke-scale.py
      - run: python desktop/scripts/smoke-sync.py
      - name: Test the installed desktop before publication
        env:
          GROUNDWORK_VERIFY_LIVE_SYNC: '1'
        shell: pwsh
        run: |
          $installer = Get-ChildItem -LiteralPath desktop/src-tauri/target/release/bundle/nsis -Filter '*-setup.exe'
          if (@($installer).Count -ne 1) { throw 'Expected exactly one Windows installer' }
          ./desktop/scripts/smoke-installed-ci.ps1 -Installer $installer.FullName
          if ($LASTEXITCODE) { throw 'Installed application checks failed' }
      - name: Prepare stable download name and checksum
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path release-assets -Force | Out-Null
          $installer = Get-ChildItem -LiteralPath desktop/src-tauri/target/release/bundle/nsis -Filter '*-setup.exe'
          Copy-Item -LiteralPath $installer.FullName -Destination release-assets/Groundwork-windows-x64-setup.exe
          $hash = (Get-FileHash -LiteralPath release-assets/Groundwork-windows-x64-setup.exe -Algorithm SHA256).Hash.ToLowerInvariant()
          Set-Content -LiteralPath release-assets/Groundwork-windows-x64-setup.exe.sha256 -Encoding ascii -Value "$hash  Groundwork-windows-x64-setup.exe"
      - uses: actions/upload-artifact@v4
        with:
          name: verified-windows-release
          path: release-assets/
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-release-test-diagnostics
          path: desktop/test-results/

  publish:
    needs: build-and-test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: verified-windows-release
          path: release-assets
      - name: Publish only verified assets
        shell: bash
        run: |
          set -euo pipefail
          cd release-assets
          sha256sum --check Groundwork-windows-x64-setup.exe.sha256
          if gh release view "$RELEASE_TAG" --json isDraft > release-state.json 2>/dev/null; then
            test "$(jq -r .isDraft release-state.json)" = true || { echo 'Published releases are immutable in this workflow; use a new version tag.'; exit 1; }
            gh release upload "$RELEASE_TAG" Groundwork-windows-x64-setup.exe Groundwork-windows-x64-setup.exe.sha256 --clobber
          else
            gh release create "$RELEASE_TAG" Groundwork-windows-x64-setup.exe Groundwork-windows-x64-setup.exe.sha256 --verify-tag --draft --title "Groundwork $RELEASE_TAG" --generate-notes
          fi
          latest=true
          prerelease=false
          if [[ "$RELEASE_TAG" == v0.* ]]; then
            latest=false
            prerelease=true
          fi
          if gh api "repos/$GH_REPO/releases/latest" > latest-release.json 2>/dev/null; then
            latest=$(python -c 'import json,os,re; old=json.load(open("latest-release.json"))["tag_name"]; new=os.environ["RELEASE_TAG"]; parse=lambda value:tuple(map(int,value[1:].split("."))); print("false" if re.fullmatch(r"v\d+\.\d+\.\d+",old) and parse(new)<parse(old) else "true")')
          fi
          gh release edit "$RELEASE_TAG" --draft=false --prerelease="$prerelease" --latest="$latest"
