name: Deploy and verify website
on:
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
concurrency:
  group: production-website
  cancel-in-progress: false
jobs:
  deploy-site:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
        working-directory: client
      - run: npm run build
        working-directory: client
      - run: npm run lint
        working-directory: client
      - run: npx playwright install --with-deps chromium
        working-directory: client
      - run: node --experimental-strip-types --test tests/releases.test.mjs tests/rendered-html.test.mjs tests/download-release-ui.test.mjs
        working-directory: client
      - name: Trigger Render deployment
        env:
          RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
        run: |
          test -n "$RENDER_DEPLOY_HOOK" || { echo 'Missing secret: RENDER_DEPLOY_HOOK'; exit 1; }
          curl --fail --silent --show-error --request POST "$RENDER_DEPLOY_HOOK" >/dev/null
      - name: Verify exact deployed website revision
        run: python scripts/verify-deployment.py https://groundwork-client.onrender.com/deployment.json "$(git rev-parse HEAD)"
      - name: Verify public page, installer link, and checksum
        run: node --experimental-strip-types scripts/verify-public-site.mjs
        working-directory: client
