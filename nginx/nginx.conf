events {}

http {
  # Resolve Compose service names at request time. This keeps Nginx running
  # while API/client containers are recreated and avoids stale container IPs.
  resolver 127.0.0.11 valid=10s ipv6=off;

  server {
    listen 80;
    server_tokens off;
    client_max_body_size 50m;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location /api/ {
      set $api_upstream api:8000;
      proxy_pass http://$api_upstream;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_read_timeout 120s;
    }

    location ~ ^/(docs|openapi.json|health) {
      set $api_upstream api:8000;
      proxy_pass http://$api_upstream;
      proxy_set_header Host $host;
    }

    location / {
      set $client_upstream client:3000;
      proxy_pass http://$client_upstream;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-Proto $scheme;
    }
  }
}
