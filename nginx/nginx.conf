events {
  worker_connections 1024;
}

http {
  # Resolve Compose service names dynamically to avoid stale container IPs
  resolver 127.0.0.11 valid=10s ipv6=off;

  # WebSocket upgrade mapping
  map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
  }

  # Gzip compression
  gzip on;
  gzip_vary on;
  gzip_proxied any;
  gzip_comp_level 6;
  gzip_min_length 256;
  gzip_types
    text/plain
    text/css
    text/xml
    application/json
    application/javascript
    application/rss+xml
    application/atom+xml
    image/svg+xml;

  server {
    listen 80;
    server_tokens off;
    client_max_body_size 50m;

    # Global Security Headers
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # API endpoints (configured for unbuffered Server-Sent Events / streaming)
    location /api/ {
      set $api_upstream api:8000;
      proxy_pass http://$api_upstream;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_read_timeout 300s;
      proxy_send_timeout 300s;

      # Critical for SSE streaming (disables Nginx buffering so tokens stream in real time)
      proxy_buffering off;
      proxy_cache off;
      chunked_transfer_encoding on;
    }

    # Documentation and Health Check endpoints
    location ~ ^/(docs|openapi.json|health) {
      set $api_upstream api:8000;
      proxy_pass http://$api_upstream;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Frontend SPA
    location / {
      set $client_upstream client:80;
      proxy_pass http://$client_upstream;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }
  }
}
